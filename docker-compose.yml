services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ci_agent}
      POSTGRES_USER: ${POSTGRES_USER:-ci_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ci_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # gives the agent access to the Docker daemon so it can launch sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
