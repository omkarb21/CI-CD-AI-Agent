name: CI Fix Agent

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of a failed CI run to fix"
        required: true
      dry_run:
        description: "Skip pushing the branch and opening the PR"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  fix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       !startsWith(github.event.workflow_run.head_branch, 'agent-fix/'))
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      DEBUG_FILE: ${{ runner.temp }}/agent_debug.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || '' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r agent/requirements.txt
      - name: Run agent
        run: python agent/main.py
      - name: Save git diff
        if: always()
        run: git diff >> "$DEBUG_FILE" || true
      - name: Upload debug file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-debug
          path: ${{ runner.temp }}/agent_debug.txt
          if-no-files-found: ignore
